<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Work</title>
<meta name="description" content="Notes, projects and study material. Free to view and download.">
<meta name="theme-color" content="#eef3e9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="id">
      <h1 id="site-title">My Work</h1>
      <p id="site-tagline" class="tagline">Notes, projects and study material. Free to view and download.</p>
    </div>
    <label class="search" for="q">
      <span class="sr">Search</span>
      <input id="q" type="search" placeholder="Search everything" autocomplete="off">
    </label>
  </header>

  <main id="panels" class="panels" aria-label="Subjects">
    <noscript><p class="problem">This page needs JavaScript turned on to list the files.</p></noscript>
  </main>

  <footer class="foot">Everything here is free to view and download.</footer>
</div>

<div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewer-title">
  <div class="viewer-card">
    <div class="viewer-bar">
      <h2 id="viewer-title">Preview</h2>
      <div class="viewer-actions">
        <a id="viewer-open" class="btn ghost" href="#" target="_blank" rel="noopener">Open in new tab</a>
        <a id="viewer-dl" class="btn ghost" href="#" download>Download</a>
        <button id="viewer-close" class="btn" type="button">Close</button>
      </div>
    </div>
    <iframe id="viewer-frame" title="Preview" src="about:blank"></iframe>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
